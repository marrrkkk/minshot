name: Release

# A tag cuts a release: the installer and the portable exe are attached to
# the GitHub Release of that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # The tag, package.json, Cargo.toml and tauri.conf.json must agree,
      # or the installer gets the wrong version in its file name.
      - run: node scripts/check-version.mjs ${{ github.ref_name }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: the public half is in tauri.conf.json, this is
          # the private half. The build signs the update bundle with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: minshot ${{ github.ref_name }}
          releaseBody: Download the installer below, run it, and press Ctrl+Shift+4.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          # The updater feed: latest.json points at the signed installer.
          uploadUpdaterJson: true
          uploadPlainBinary: true
