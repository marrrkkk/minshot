<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minshot</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #card { margin: 0; border-radius: 10px; overflow: hidden;
    background: rgba(24,24,27,0.96); border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    color: #e4e4e7; font-size: 12px; }
  #bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex: none; }
  #bar span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
  #close { border: 0; border-radius: 6px; background: transparent; color: #e4e4e7;
    font-size: 14px; cursor: pointer; padding: 2px 8px; flex: none; }
  #close:hover { background: rgba(255,255,255,0.12); }
  #imgwrap { position: relative; line-height: 0; }
  #shot { display: block; width: 100%; height: auto; cursor: grab; }
  #shot:active { cursor: grabbing; }
  #dropHint { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.72); border: 1.5px dashed #4da3ff; color: #dbeafe;
    font-size: 12px; line-height: 1.4; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
  #foot { padding: 6px 8px 7px; color: #a1a1aa; font-size: 11px; line-height: 1.4; }
  /* Drag-in-progress feedback: thumbnail shrinks, dims, shows drop hint. */
  #card.dragging { transform: scale(0.95); box-shadow: 0 4px 16px rgba(77,163,255,0.35);
    outline: 2px dashed #4da3ff; outline-offset: -2px; }
  #card.dragging #shot { opacity: 0.6; }
  #card.dragging #dropHint { display: block; }
</style>
</head>
<body>
<div id="card">
  <div id="bar"><div class="dot" data-tauri-drag-region></div><span id="meta" data-tauri-drag-region>minshot — drag image into terminal, or Ctrl+V to paste</span><button id="close" title="Dismiss">✕</button></div>
  <div id="imgwrap"><img id="shot" alt="screenshot preview" draggable="false" /><div id="dropHint">Release to drop into terminal</div></div>
  <div id="foot">Drag the image into Windows Terminal / OpenCode, or paste with Ctrl+V. New capture replaces this.</div>
</div>
<script type="module" src="./preview.ts"></script>
</body>
</html>
