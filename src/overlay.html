<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minshot overlay</title>
<style>
  /* Self-contained on purpose: NO external stylesheet. A previous version
   * linked theme.css, whose opaque page background won the cascade and
   * painted the whole screen solid instead of a transparent dim. The dim
   * below must always win, hence !important. */
  html {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    /* Single dim layer on <html> only. NOTE: do NOT also set a background on
     * <body> — both would paint and double-darken the screen. Must stay
     * !important: any opaque page background would paint the whole screen
     * solid instead of a transparent dim. */
    background: rgba(0,0,0,0.30) !important;
  }
  body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: transparent !important;
    cursor: crosshair;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #sel { position: fixed; border: 1.5px solid #fafafa; background: rgba(250,250,250,0.10);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 24px rgba(0,0,0,0.35);
    display: none; pointer-events: none; }
  #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; white-space: nowrap;
    background: rgba(9,9,11,0.8); color: #fafafa;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 9999px;
    font-size: 12px; font-weight: 500; padding: 6px 12px; pointer-events: none; }
  #hint .kbd { display: inline-block; border: 1px solid rgba(255,255,255,0.16); border-bottom-width: 2px;
    border-radius: 6px; background: rgba(255,255,255,0.12); color: #fafafa;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; padding: 1px 6px; }
</style>
</head>
<body>
<div id="hint">Drag to select a region · <span class="kbd">Esc</span> to cancel</div>
<div id="sel"></div>
<script type="module" src="./overlay.ts"></script>
</body>
</html>
