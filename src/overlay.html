<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minshot overlay</title>
<link rel="stylesheet" href="./theme.css" />
<style>
  html, body { background: rgba(0,0,0,0.45); cursor: crosshair; }
  html, body, #stage { width: 100vw; height: 100vh; overflow: hidden; }
  #sel { position: fixed; border: 1.5px solid var(--primary); background: rgba(250,250,250,0.10);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 24px rgba(0,0,0,0.35);
    display: none; pointer-events: none; }
  #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    pointer-events: none; display: flex; gap: 0.375rem; align-items: center;
    background: rgba(9,9,11,0.8); color: #fafafa; border-color: rgba(255,255,255,0.16);
    font-size: 0.75rem; padding: 0.375rem 0.75rem; }
  #hint .kbd { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.16); color: #fafafa; }
</style>
</head>
<body>
<div id="stage">
  <div id="hint" class="badge">Drag to select a region · <span class="kbd">Esc</span> to cancel</div>
  <div id="sel"></div>
</div>
<script type="module" src="./overlay.ts"></script>
</body>
</html>
