[package]
name = "minshot"
version = "0.3.0"
edition = "2021"
authors = ["marrrkkk <marklouie.dev@gmail.com>"]
description = "Minimal Windows screenshot-to-terminal utility"
license = "MIT"
repository = "https://github.com/marrrkkk/minshot"
# The updater plugin needs 1.90.
rust-version = "1.90"

[lib]
name = "minshot_lib"
# rlib only: the desktop binary links it. staticlib/cdylib exist for the
# mobile targets and cost a 100 MB .lib per build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# windows-core is needed by name: the #[implement] macro emits ::windows_core paths.
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
# The release build is the fast one: the PNG encoder and the screen grab
# are the hot paths, so optimize for speed and let the linker see
# everything. `panic = "abort"` and `strip` keep the binary small.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
