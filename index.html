<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minshot</title>
<style>
  html, body { margin: 0; padding: 0; background: #18181b; color: #e4e4e7;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .hidden { display: none !important; }

  /* ---- home view ---- */
  #homeView { display: flex; flex-direction: column; height: 100vh; padding: 16px; box-sizing: border-box; }
  #head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  #head .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; }
  #head span.sub { font-weight: 400; color: #a1a1aa; font-size: 12px; }
  .newBtn { margin-top: 14px; border: 1px solid rgba(77,163,255,0.45); border-radius: 8px;
    background: rgba(77,163,255,0.14); color: #dbeafe; font-size: 14px; font-weight: 600;
    padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .newBtn:hover { background: rgba(77,163,255,0.24); }
  .newBtn:active { transform: scale(0.98); }
  #hint { margin-top: 8px; font-size: 12px; color: #a1a1aa; text-align: center; }
  #hint b { color: #d4d4d8; font-weight: 600; }
  #status { margin-top: auto; font-size: 12px; color: #4ade80; min-height: 16px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .quit { border: 0; background: transparent; color: #71717a; font-size: 12px; cursor: pointer; padding: 4px 0; }
  .quit:hover { color: #e4e4e7; }
  .ver { color: #52525b; font-size: 11px; }

  /* ---- shot view ---- */
  #shotView { padding: 10px; box-sizing: border-box; }
  #shotCard { border-radius: 10px; overflow: hidden; background: rgba(24,24,27,0.96);
    border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease; }
  #metaBar { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    color: #e4e4e7; font-size: 12px; }
  #metaBar .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex: none; }
  #meta { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.85; }
  #imgwrap { position: relative; line-height: 0; }
  #shot { display: block; width: 100%; height: auto; cursor: grab; }
  #shot:active { cursor: grabbing; }
  #dropHint { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.72); border: 1.5px dashed #4da3ff; color: #dbeafe;
    font-size: 12px; line-height: 1.4; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
  #shotFoot { padding: 6px 8px 7px; color: #a1a1aa; font-size: 11px; line-height: 1.4; }
  #shotView .newBtn { margin-top: 8px; width: 100%; box-sizing: border-box; }
  #shotView .foot { margin-top: 4px; }
  /* Drag-in-progress feedback. */
  #shotCard.dragging { transform: scale(0.96); box-shadow: 0 4px 16px rgba(77,163,255,0.35);
    outline: 2px dashed #4da3ff; outline-offset: -2px; }
  #shotCard.dragging #shot { opacity: 0.6; }
  #shotCard.dragging #dropHint { display: block; }
</style>
</head>
<body>
<div id="homeView">
  <div id="head" data-tauri-drag-region><div class="dot"></div>minshot <span class="sub">screenshot → terminal</span></div>
  <button class="newBtn" title="Capture a screen region">✂&nbsp; New capture</button>
  <div id="hint">or press <b>Ctrl+Shift+4</b> anywhere</div>
  <div id="status"></div>
  <div class="foot"><span class="ver">v0.1.0</span><button class="quit">Quit</button></div>
</div>
<div id="shotView" class="hidden">
  <div id="shotCard">
    <div id="metaBar" data-tauri-drag-region><div class="dot"></div><span id="meta">minshot</span></div>
    <div id="imgwrap"><img id="shot" alt="screenshot" draggable="false" /><div id="dropHint">Release to drop into terminal</div></div>
    <div id="shotFoot">Drag the image into Windows Terminal / OpenCode, or paste with Ctrl+V.</div>
  </div>
  <button class="newBtn" title="Capture a screen region">✂&nbsp; New capture</button>
  <div class="foot"><span class="ver">v0.1.0</span><button class="quit">Quit</button></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
