<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="theme-color" content="#0b0b0e" />
<title>minshot</title>
<link rel="stylesheet" href="/src/theme.css" />
<link rel="stylesheet" href="/src/app.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <!-- Launcher: the app's front door. -->
  <div id="home" class="view active">
    <header class="appbar" data-tauri-drag-region="deep">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 256 256"><path fill="currentColor" d="M16 40 H240 V216 H204 V76 H146 V216 H110 V76 H52 V216 H16 Z"/></svg>
      </span>
      <span class="wordmark">minshot</span>
    </header>
    <div class="home-body">
      <button id="newBtn" class="btn btn-primary btn-lg newBtn" type="button" title="Capture a region of the screen">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        <span class="btn-label">New capture</span>
      </button>
      <p class="hint">
        <span id="keys"></span>
        <span class="hint-text">to capture anywhere</span>
      </p>
      <div class="save-row">
        <span class="save-label">Save to</span>
        <span class="save-dir" id="saveDir">Temp folder</span>
        <button id="saveDirBtn" class="btn btn-quiet" type="button" title="Choose a folder for the screenshots">Change</button>
        <button id="saveDirReset" class="btn btn-quiet btn-icon" type="button" title="Save to the temp folder instead" hidden>&times;</button>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <button id="updateBtn" class="btn btn-secondary" type="button" hidden>Install update</button>
    </div>
  </div>

  <!-- Shot view: the capture, and the two things you can do with it. -->
  <div id="shot" class="view">
    <div class="toolbar" data-tauri-drag-region="deep">
      <div class="tb-meta">
        <span class="dot" id="clipDot" title="On the clipboard"></span>
        <span class="tb-title">Screenshot</span>
        <span class="tb-dims" id="dims">–</span>
      </div>
      <div class="tb-actions">
        <button id="copyBtn" class="btn btn-secondary" type="button" title="Copy the screenshot to the clipboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>
          <span id="copyLabel" class="btn-label">Copy</span>
        </button>
        <button id="newBtn2" class="btn btn-primary newBtn" type="button" title="Capture another region (replaces this one)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>
          <span class="btn-label">New capture</span>
        </button>
      </div>
    </div>
    <div class="preview" id="preview">
      <img id="shotImg" alt="Screenshot" draggable="false" />
      <div class="drop-hint">Release to drop into a terminal</div>
    </div>
  </div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
